<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launching</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .window {
      width: 100vw;
      height: 100vh;
      background: #1b1b1b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 14px 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }

    .icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #121212;
      border: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-wrap img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .header-text {
      flex: 1;
      min-width: 0;
    }

    .inst-name {
      font-size: 14px;
      font-weight: 700;
      color: #e2e2ea;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .inst-sub {
      font-size: 11px;
      color: rgba(226, 226, 234, 0.4);
      margin-top: 1px;
    }

    /* ── Header action area ── */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* ── Console button ── */
    .abort-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(226, 226, 234, 0.45);
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      white-space: nowrap;
      align-self: flex-start;
    }
    .abort-btn:hover {
      color: #e2e2ea;
      border-color: rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.05);
    }
    .abort-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .abort-btn svg { flex-shrink: 0; }

    /* ── Close button + confirm wrapper ── */
    .close-wrap {
      position: relative;
      display: flex;
      align-items: flex-start;
    }

    .close-btn {
      background: none;
      border: none;
      color: rgba(226, 226, 234, 0.3);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      padding: 5px;
      border-radius: 6px;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .close-btn:hover { color: #e2e2ea; }

    /* Confirm tooltip shown on first close click while launch is still in progress */
    .close-confirm {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: #2a2a2a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 8px 11px;
      white-space: nowrap;
      font-size: 11.5px;
      color: rgba(226, 226, 234, 0.85);
      pointer-events: none;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.15s, transform 0.15s;
      z-index: 99;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .close-confirm.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .close-confirm strong {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #e2e2ea;
      margin-bottom: 2px;
    }
    .close-confirm span {
      color: rgba(226, 226, 234, 0.55);
      font-size: 11px;
    }

    /* ── Status bar ── */
    .status-bar {
      padding: 8px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }

    .status-text {
      font-size: 12px;
      color: rgba(226, 226, 234, 0.65);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-text.error { color: #ef4444; }

    /* ── Log area ── */
    .log-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-area::-webkit-scrollbar { width: 0; }

    .log-entry {
      font-size: 11px;
      color: rgba(226, 226, 234, 0.38);
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-entry.current {
      color: rgba(226, 226, 234, 0.75);
    }

    .log-entry.ok {
      color: rgba(183, 183, 183, 0.55);
    }

    .log-entry.fail {
      color: rgba(239, 68, 68, 0.8);
    }
  </style>
</head>
<body>
  <div class="window">
    <!-- Header -->
    <div class="header" data-tauri-drag-region>
      <div class="icon-wrap" data-tauri-drag-region>
        <img id="mini-icon-img" src="" alt="" data-tauri-drag-region />
      </div>
      <div class="header-text" data-tauri-drag-region>
        <div class="inst-name" id="mini-title">Minecraft</div>
        <div class="inst-sub" id="mini-sub">Launching…</div>
      </div>

      <!-- Action buttons -->
      <div class="header-actions">
        <!-- Console: opens the log window for this instance -->
        <button class="abort-btn" id="btn-mini-abort" title="Open the log console for this instance">
          <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3,5 6,8 3,11"/>
            <line x1="8" y1="11" x2="13" y2="11"/>
          </svg>
          Console
        </button>

        <!-- Close: first click shows confirm badge, second click cancels launch + closes -->
        <div class="close-wrap">
          <button class="close-btn" id="btn-mini-close" title="Close">✕</button>
          <div class="close-confirm" id="close-confirm">
            <strong>Cancel launch?</strong>
            <span>Click again to confirm</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Current status -->
    <div class="status-bar">
      <div class="status-text" id="mini-status">Preparing launch</div>
    </div>

    <!-- Log feed -->
    <div class="log-area" id="log-area"></div>
  </div>

  <script type="module" src="/src/js/launching.js"></script>
</body>
</html>

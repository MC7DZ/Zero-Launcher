[package]
name = "ZeroLauncher"
version = "2.3.0"
edition = "2021"

# Smaller AppImage: optimize for size, strip symbols, drop unwind tables.
# `strip = "debuginfo"` also means the AppImage build's NO_STRIP=1 workaround
# (for a linuxdeploy bug with modern ELF sections) no longer costs an
# unstripped binary — Cargo strips it before linuxdeploy ever sees it.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Must stay "unwind": cancelling a download is implemented by unwinding out of
# the installer's progress callback (see CANCEL_MARKER in commands/minecraft.rs)
# and catching it with catch_unwind. With "abort" that cancel killed the whole
# launcher and was reported as a Rust panic crash.
panic = "unwind"
# Keep the symbol table so crash backtraces show function names.
strip = "debuginfo"

[lib]
name = "zero_launcher_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
socket2 = "0.5"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only what's actually used in src/: tokio::process (launching the JVM/
# Minecraft process), tokio::io (AsyncBufReadExt/BufReader for streaming
# process output), tokio::spawn / task::spawn_blocking (needs a
# multi-thread runtime), tokio::time::sleep. "full" pulled in every
# subsystem (signal handling, full net stack, etc.) unconditionally.
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "net"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
url = "2"
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls", "hickory-dns", "multipart"] }
mc-launcher-core = { path = "vendor/mc-launcher-core" }
open = "5.4.0"
# Reads zips (jar/mod inspection, Java archive extraction in
# commands/mods.rs and commands/java.rs) and writes one (crash report
# bundle in crashreport.rs). Dropping default features removes every
# non-deflate codec (bzip2, zstd, aes encryption, etc.) that the default
# feature set bundles.
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
discord-rich-presence = "1.1.0"
sha1 = "0.10"
flate2 = "1"
tar = "0.4"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
# Provides SetProcessWorkingSetSize + GetCurrentProcess for trim_memory().
# Only the Threading feature is needed — everything else is gated off,
# so this adds almost no size to the Windows binary.
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Lets us set GLib's "prgname" before any window is created. Tao/GTK never
# expose a way to set the Wayland xdg-shell app_id directly (see
# https://github.com/tauri-apps/tao/issues/910) — on Wayland, GTK derives
# it from g_prgname the first time a surface is realized, and g_prgname
# otherwise defaults to whatever GLib guesses from argv[0] (which for an
# AppImage-launched binary is an unpredictable temp mount path/name).
# Pinned to the same 0.18 line tao/gtk-rs already pull in transitively, so
# this doesn't add a second copy of glib to the build.
glib = "0.18"
# Signal handlers for native-crash reports (see src/crashlog.rs).
libc = "0.2"


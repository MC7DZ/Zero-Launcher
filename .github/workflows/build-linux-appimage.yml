name: Build AppImage
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Tauri App/package-lock.json

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Tauri App/src-tauri

      - name: Make build script executable
        run: chmod +x "Tauri App/build.sh"

      - name: Install system dependencies
        working-directory: Tauri App
        run: ./build.sh --deps

      - name: Build in release mode
        working-directory: Tauri App
        run: ./build.sh --release

      - name: Upload build artifacts (AppImage)
        uses: actions/upload-artifact@v5
        with:
          name: zerolauncher-linux-build
          path: |
            Tauri App/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

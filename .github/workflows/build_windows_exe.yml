name: Build WINDOWS EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Tauri App/package-lock.json

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Tauri App/src-tauri

      - name: Install frontend deps
        working-directory: Tauri App
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: Tauri App
          args: --no-bundle

      - name: Upload portable exe
        uses: actions/upload-artifact@v5
        with:
          name: ZeroLauncher-portable-exe
          path: Tauri App/src-tauri/target/release/ZeroLauncher.exe
          if-no-files-found: error

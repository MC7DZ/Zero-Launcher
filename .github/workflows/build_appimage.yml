name: Build LINUX AppImage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Update system and install base dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            curl \
            wget \
            file \
            rustup \
            nodejs \
            npm \
            webkit2gtk-4.1 \
            gtk3 \
            libappindicator-gtk3 \
            librsvg \
            patchelf \
            fuse2 \
            desktop-file-utils

      - name: Set up Rust
        run: |
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Containers usually can't mount FUSE (no --privileged), so make
          # every AppImage step (linuxdeploy, its plugins, the final
          # AppImage build) fall back to self-extracting instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy's bundled `strip` chokes on the newer `.relr.dyn`
          # ELF section produced by current toolchains (same issue you hit
          # locally on CachyOS) — skip stripping to avoid the failure.
          NO_STRIP: "1"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ZeroLauncher-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
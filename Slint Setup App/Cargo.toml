[package]
name = "zero-launcher-setup"
version = "1.0.0"
edition = "2021"
authors = ["Zero Launcher Contributors"]
description = "Setup and installer for Zero Launcher"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
